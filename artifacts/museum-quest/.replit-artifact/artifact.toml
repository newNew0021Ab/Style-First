kind = "web"
previewPath = "/"
title = "Museum Quest"
version = "1.0.0"
id = "artifacts/museum-quest"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22506

[services.development]
run = "pnpm --filter @workspace/museum-quest run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/museum-quest", "run", "build" ]
publicDir = "artifacts/museum-quest/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22506"
BASE_PATH = "/"
